name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-graphite2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-libb2
            mingw-w64-ucrt-x86_64-openssl
            zip
      - name: Build
        run: make -j4 BUILD=build/win
      - name: Package
        run: |
          mkdir -p dist
          cp build/win/zoyi_gui.exe README.md LICENSE dist/
          cd dist && zip ../zoyi_gui-windows.zip zoyi_gui.exe README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: zoyi_gui-windows
          path: zoyi_gui-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: zoyi_gui-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Official Qt, not Homebrew: Homebrew's frameworks need the macOS they
      # were built on (26 at the time), the official ones run on macOS 12+.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtserialport
          cache: true
      - name: Build
        run: make -j4 -f Makefile.mac zip BUILD="$PWD/build/mac" QT_DIR="$QT_ROOT_DIR"
      - name: Check the minimum macOS
        run: |
          plutil -extract LSMinimumSystemVersion raw build/mac/ZoyiGUI.app/Contents/Info.plist
          for f in build/mac/ZoyiGUI.app/Contents/MacOS/zoyi_gui build/mac/ZoyiGUI.app/Contents/Frameworks/*.framework/Versions/A/Qt*; do
            echo "$f: $(otool -l "$f" | awk '/minos/ {print $2; exit}')"
          done
      - name: Package
        run: cp build/mac/ZoyiGUI.zip zoyi_gui-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zoyi_gui-macos
          path: zoyi_gui-macos.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: zoyi_gui-macos.zip

  linux:
    # 22.04 (glibc 2.35) so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtserialport
          cache: true
      - name: Get linuxdeploy
        run: |
          mkdir -p tools && cd tools
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x *.AppImage
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build
        run: make -j4 -f Makefile.linux appimage BUILD="$PWD/build/linux" QT_DIR="$QT_ROOT_DIR" LINUXDEPLOY="$PWD/tools/linuxdeploy-x86_64.AppImage"
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: Package
        run: cp build/linux/zoyi_gui-x86_64.AppImage zoyi_gui-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: zoyi_gui-linux
          path: zoyi_gui-linux-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: zoyi_gui-linux-x86_64.AppImage

  linux-distro:
    # Building from source against the distribution's Qt, as the README describes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6serialport6-dev
      - name: Build
        run: make -j4 -f Makefile.linux
